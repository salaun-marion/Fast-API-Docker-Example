name: Push Docker Image

on: 
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        steps:
            #1. Check out our repository so the workflow can access it
            -   name: Checkout repository
                uses: actions/checkout@v4 # we use a predefined action from GitHub actions
            #2. Set up a specific version of Python
            -   name: Set up Python
                uses: actions/setup-python@v5
                with: 
                    python-version: '3.10'
            #3. Install dependencies
            -   name: Install dependencies
                run: python -m pip install --upgrade pip
                     pip install -r requirements.txt
            #4. Run the tests
            -   name: Run tests with pytest
                run: pytest
    push-to-repo:
        runs-on: ubuntu-latest
        needs: build-and-test
        # Only run on push event
        if: github.event_name == 'push'
        steps:
            -   name: Checkout Code
                uses: actions/checkout@v4

            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v2

            -   name: Login to Docker Hub
                uses: docker/login-action@v2
                with: 
                    username: ${{secrets.DOCKER_HUB_USERNAME}}
                    password: ${{secrets.DOCKER_HUB_TOKEN}}
            
            -   name: Build and Push
                uses: docker/build-push-action@v4
                with:   
                    context: . 
                    push: true
                    platform: linux/amd64, linux/arm64,
                    tags: <docker_hub_username>/fast-api-docker-example:latest